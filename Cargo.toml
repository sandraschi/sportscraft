[workspace]
resolver = "2"
members = [
    "crates/sportscraft-kinematics",
    "crates/sportscraft-core",
    "crates/sportscraft-mcp",
    "crates/sportscraft-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Antigravity Craft Collective"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.37"
clap = { version = "4.5", features = ["derive"] }
